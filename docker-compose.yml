services:
  postgres:
    image: postgres:18-alpine
    container_name: realtime-notifications-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: realtime_notifications
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
      # Aplicado automaticamente só na primeira criação do volume.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d realtime_notifications']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
